<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#primaryGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Document Sheet -->
  <path d="M 30 25 L 56 25 L 70 39 L 70 75 C 70 77.2 68.2 79 66 79 L 30 79 C 27.8 79 26 77.2 26 75 L 26 29 C 26 26.8 27.8 25 30 25 Z" fill="#ffffff" />
  
  <!-- Folded Corner -->
  <path d="M 56 25 L 56 39 L 70 39 Z" fill="#e2e8f0" />
  
  <!-- Scales of Justice Emblem on Document -->
  <!-- Center Beam -->
  <line x1="48" y1="42" x2="48" y2="68" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="38" y1="68" x2="58" y2="68" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <!-- Horizontal Balance Bar -->
  <line x1="36" y1="46" x2="60" y2="46" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left Scale Pan -->
  <path d="M 36 46 L 32 55 L 40 55 Z" fill="none" stroke="#d97706" stroke-width="1.5" />
  <path d="M 30 55 Q 36 60 42 55 Z" fill="url(#goldGrad)" />
  <!-- Right Scale Pan -->
  <path d="M 60 46 L 56 55 L 64 55 Z" fill="none" stroke="#d97706" stroke-width="1.5" />
  <path d="M 54 55 Q 60 60 66 55 Z" fill="url(#goldGrad)" />
  <!-- Top Center Finial -->
  <circle cx="48" cy="43" r="2.5" fill="#d97706" />
</svg>
